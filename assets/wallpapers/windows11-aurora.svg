#!/usr/bin/env bash
set -euo pipefail

# Reverts the simple visual tweaks used by this theme.

if [[ "$(uname)" != "Darwin" ]]; then
  echo "This uninstall script only works on macOS."
  exit 1
fi

defaults delete com.apple.dock orientation 2>/dev/null || true
defaults delete com.apple.dock show-process-indicators 2>/dev/null || true
defaults delete com.apple.dock show-recents 2>/dev/null || true
defaults delete com.apple.dock mineffect 2>/dev/null || true
defaults delete com.apple.dock tilesize 2>/dev/null || true
defaults delete com.apple.dock autohide 2>/dev/null || true
defaults delete com.apple.dock magnification 2>/dev/null || true

defaults delete NSGlobalDomain AppleReduceDesktopTinting 2>/dev/null || true
defaults delete NSGlobalDomain AppleFontSmoothing 2>/dev/null || true

killall Dock

echo "Theme preferences removed."
echo "Your previous wallpaper and Dock settings may still be restored manually if needed."
